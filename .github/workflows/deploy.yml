# Breach Escape: scan, then deploy.
# Production: only on push to main, after CodeQL passes.
# Pull requests: CodeQL, then an Azure Static Web Apps preview environment; the close job removes it when the PR closes.
# Actions are pinned to full commit SHAs (tag in the comment); Dependabot keeps them current.

name: Scan and deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  schedule:
    - cron: "17 9 * * 1"   # weekly re-scan, Mondays 09:17 UTC
  workflow_dispatch:

# Least privilege by default: every job starts read-only.
permissions:
  contents: read

# One group per PR (so a PR's 'closed' run never shares a group with the push to main
# that a merge triggers), one per ref otherwise. Only PR runs cancel older runs in their
# group; runs on main (push, schedule, dispatch) queue instead, so a production deploy is
# never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: CodeQL
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write   # upload results to the Security tab
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:javascript-typescript"

  deploy:
    name: Deploy to Azure Static Web Apps
    needs: codeql
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The deployment token is an environment secret, only released to jobs
    # running from main in the 'production' environment.
    environment:
      name: production
      url: https://play.keptacademy.com
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Deploy (static files, no build)
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: "public"
          api_location: ""
          output_location: ""
          skip_app_build: true

  # Preview environment for a pull request. Runs only for branches in this repository (forks get no token).
  # Uses the same deployment token as production; that secret has to be readable by this job
  # (repository secret, or an environment secret on the 'preview' environment).
  preview:
    name: Deploy PR preview
    needs: codeql
    if: >-
      github.event_name == 'pull_request' && github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: preview
    permissions:
      contents: read
      pull-requests: write   # lets the action comment the preview URL on the PR
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Deploy preview (static files, no build)
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "public"
          api_location: ""
          output_location: ""
          skip_app_build: true

  # Removes the PR's preview environment when the PR is closed or merged.
  close_preview:
    name: Close PR preview
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: preview
    permissions:
      contents: read
    steps:
      - name: Close preview environment
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
